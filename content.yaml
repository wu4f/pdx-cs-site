# Declarative config: which docs to ingest, how to split them, and which
# categories are valid.

docs:
  - id: "11azwsMnSUPpR9ClIHSqZ3AcLvKdo0VqBMQyO9GacI9M"
    splitter: tabs
    name: "web.cs.pdx.edu"

  # The Graduate Handbook, rendered as a single whole page (no splitting).
  - id: "1Tp7lrY-nAgmlElgtDCxt3rrhJZuMN_9eBKARa7Ewb_Q"
    splitter: whole
    name: "Graduate Handbook (whole)"

categories:
  allowed:
    - about
    - undergraduate
    - graduate
    - resources
    - ignore

templates:
  page: "templates/base.html"

chat:
  model: "gemini-3.5-flash"
